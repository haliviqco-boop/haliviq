<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 1800 1090" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050310"/>
      <stop offset="55%" stop-color="#070312"/>
      <stop offset="100%" stop-color="#0A0616"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#C9B6FF" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#9C7CF4" stop-opacity="0.55"/>
      <stop offset="58%" stop-color="#5A4ED4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5A4ED4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241A45"/>
      <stop offset="100%" stop-color="#160F2E"/>
    </linearGradient>

    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B3B8C"/>
      <stop offset="100%" stop-color="#241A45"/>
    </linearGradient>

    <linearGradient id="ridgeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7CF0"/>
      <stop offset="55%" stop-color="#6656D6"/>
      <stop offset="100%" stop-color="#241A45"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9A6FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4A3D8C" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft-lg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1800" height="1090" fill="url(#sky)"/>

  <!-- big ambient glow behind everything -->
  <ellipse cx="900" cy="700" rx="620" ry="360" fill="url(#glow)" filter="url(#soft-lg)"/>

  <!-- tagline -->
  <text x="900" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="300" font-size="34" letter-spacing="14" fill="#F4F2FF" fill-opacity="0.92">HUMAN IDEAS. INTELLIGENT FUTURE.</text>

  <!-- back ridge -->
  <path filter="url(#soft)" fill="url(#ridgeBack)" opacity="0.85" d="M0,560 C120,520 220,585 340,555 C460,525 520,470 640,500 C760,530 800,590 920,565 C1040,540 1100,480 1220,510 C1340,540 1400,600 1520,570 C1620,545 1680,520 1800,545 L1800,1090 L0,1090 Z"/>

  <!-- mid ridge -->
  <path filter="url(#soft)" fill="url(#ridgeMid)" opacity="0.8" d="M0,660 C100,600 200,650 300,615 C420,575 480,630 600,615 C700,600 760,540 900,545 C1040,550 1100,610 1200,615 C1320,620 1380,575 1500,610 C1620,645 1700,655 1800,625 L1800,1090 L0,1090 Z"/>

  <!-- valley water sheen -->
  <ellipse cx="900" cy="860" rx="480" ry="140" fill="url(#water)" filter="url(#soft)"/>

  <!-- front ridge: two peaks with a soft valley dip in the middle so the glow shines through -->
  <path filter="url(#soft-sm)" fill="url(#ridgeFront)" opacity="0.97" d="M0,780 C150,720 280,760 420,730 C560,700 650,655 760,690 C830,712 870,780 900,845 C930,780 970,712 1040,690 C1150,655 1240,700 1380,730 C1520,760 1650,720 1800,780 L1800,1090 L0,1090 Z"/>

  <!-- wordmark: HALIVIQ (white + purple accent), in the dark foreground below the valley -->
  <g transform="translate(346,767) scale(0.62)">
