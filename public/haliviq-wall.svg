    <path d="M824.352,348.756L871.385,348.756C873.201,348.756 874.879,348.343 876.422,347.516L882.616,344.294L882.616,345.905L877.171,348.756L866.893,354.147C865.35,354.974 863.671,355.387 861.856,355.387L817.069,355.387L817.069,312.006L824.352,312.006L824.352,348.756Z" fill="#FFFFFF"/>
