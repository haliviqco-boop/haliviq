    <rect x="1058.02" y="312.006" width="7.283" height="43.38" fill="#FFFFFF"/>
    <path d="M1152.70,321.26 A21.69,21.69 0 1,0 1152.70,346.13 M1116.15,344.54 L1100,363" fill="none" stroke="#A577FD" stroke-width="7.283" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
